spring:
  application:
    name: streaming-service
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: streaming-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.antar.streamingservice.event.VideoEncodedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${STREAMING_DB_URL}
    username: ${STREAMING_DB_USERNAME}
    password: ${STREAMING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  grpc:
    client:
      channels:
        auth-service:
          address: static://auth-service:4091
        nas-orchestrator:
          address: static://nas-orchestrator:4092

server:
  port: 9006

nas:
  orchestrator:
    base-url: http://nas-orchestrator:9002

auth:
  service:
    base-url: http://auth-service:9000
    url: ${AUTH_SERVICE_URL}
  client:
    id: ${AUTH_CLIENT_ID}
    secret: ${AUTH_CLIENT_SECRET}
    audience: ${AUTH_CLIENT_AUDIENCE}
    scope: ${AUTH_CLIENT_SCOPE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5501}

management:
  endpoints:
    web:
      exposure:
        include: health, info