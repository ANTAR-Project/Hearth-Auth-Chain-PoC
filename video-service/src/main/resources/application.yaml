spring:
  application:
    name: video-service
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      fail-fast: true   # crash loudly if Kafka is unreachable at startup instead of silently continuing
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  grpc:
    client:
      channels:
        nas-orchestrator:
          address: static://nas-orchestrator:4092

server:
  port: 9004

nas:
  orchestrator:
    base-url: http://nas-orchestrator:9002

auth:
  service:
    base-url: http://auth-service:9000
    url: ${AUTH_SERVICE_URL}
  client:
    id: ${AUTH_CLIENT_ID}
    secret: ${AUTH_CLIENT_SECRET}
    audience: ${AUTH_CLIENT_AUDIENCE}
    scope: ${AUTH_CLIENT_SCOPE}

hearth:
  gateway:
    jwks-uri: http://api-gateway:8081/internal/jwks

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5501}

management:
  endpoints:
    web:
      exposure:
        include: health, info